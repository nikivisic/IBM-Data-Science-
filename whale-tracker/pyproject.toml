[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whale-tracker"
version = "0.1.0"
description = "Wallet discovery and repeatability scoring for Solana memecoin traders (read-only, Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
whale-tracker = "whale_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["whale_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
